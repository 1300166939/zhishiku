name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_public_tree.py
      - run: python -m unittest discover -s prototype -p 'test_*.py'
        env:
          PYTHONPATH: prototype:integration:deployment
      - run: python -m unittest discover -s integration -p 'test_*.py'
        env:
          PYTHONPATH: prototype:integration:deployment
